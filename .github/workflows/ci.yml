name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimale Rechte fuer das GITHUB_TOKEN (Checkout genuegt; Artefakt-Upload und Cache nutzen eigene Laufzeit-Tokens).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Name unveraendert: Pflicht-Check im Ruleset "main-schutz".
  check:
    name: Typen, Lint, Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Der Build rendert Seiten vor und braucht dafuer eine migrierte Datenbank.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/socaz
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src tests scripts
      - run: npm test
      # Jede Browser-Test-Datei muss in genau einem Shard stehen (tests/e2e-shards.json); sonst fiele sie still aus der CI.
      - run: node scripts/e2e-shards.mjs check
      - run: node scripts/migrate.mjs
      - run: npm run build

  # Reine Doku-PRs (alle geaenderten Dateien unter docs/ oder .md, nie .github, package.json, Lockfile oder Code-Baeume) ueberspringen die Browser-Tests.
  # Logik und Tests: scripts/ci-gate.mjs, tests/unit/ci-gate.test.ts. Bei Fehler, leerer Liste, neuem Branch oder Force-Push gilt docs_only=false.
  changes:
    name: Änderungen prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Nur Doku geändert?
        id: docs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-gate.mjs changes

  # Browser-Tests in 5 Teilen, nach gemessener Laufzeit aufgeteilt (tests/e2e-shards.json, Pruefung: scripts/e2e-shards.mjs, tests/unit/e2e-shards.test.ts).
  # Jeder Teil hat einen eigenen Postgres-Dienst (nichts wird geteilt). Der Sammelcheck "Browser-Tests" (Job browser-tests) bleibt EIN Check.
  e2e-shard:
    name: Browser-Tests Teil ${{ matrix.shard }}/5
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # Offizielles Playwright-Image, Version EXAKT wie @playwright/test in package-lock.json
    # (der Schritt "Playwright-Version pruefen" bricht bei Abweichung ab). Digest = Multi-Arch-Index (MCR, abgefragt 2026-11-11 15:14 UTC).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Im Container-Job ist der Dienst unter seinem Namen erreichbar, nicht ueber 127.0.0.1 (der Waechter der Integrationstests erlaubt "postgres" nur mit GITHUB_ACTIONS=true)
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/socaz
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      E2E_BASE_URL: http://127.0.0.1:3100
      STRIPE_WEBHOOK_SECRET: whsec_e2e_lokaler_testschluessel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Playwright-Version pruefen
        run: |
          node -e '
            const fs = require("fs");
            const lock = require("./package-lock.json").packages["node_modules/@playwright/test"].version;
            const m = fs.readFileSync(".github/workflows/ci.yml", "utf8").match(/playwright:v([0-9.]+)-/);
            if (!m || m[1] !== lock) { console.error("Image-Tag " + (m && m[1]) + " != Lockfile " + lock); process.exit(1); }
            console.log("Playwright " + lock + " == Image-Tag");
          '
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
      - name: Entwicklungsserver starten
        env:
          PAYMENTS_FAKE: "1"
        run: |
          npm run dev -- -p 3100 > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/api/health && exit 0
            sleep 2
          done
          cat dev-server.log
          exit 1
      - name: Browser-Tests dieses Teils
        env:
          # Auch der Test-Prozess braucht die Variable (die Specs karte-lobby und karte-freigabe pruefen sie und werden sonst uebersprungen); der Entwicklungsserver hat sie schon.
          PAYMENTS_FAKE: "1"
        run: |
          set -e
          files=$(node scripts/e2e-shards.mjs list ${{ matrix.shard }})
          test -n "$files"
          npx playwright test $files
      - name: Berichte sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-fehler-${{ matrix.shard }}
          path: |
            test-results
            dev-server.log
          retention-days: 14

  integration:
    name: Integrationstests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Ohne Container direkt auf dem Runner: der Dienst ist ueber 127.0.0.1 erreichbar (wie bisher).
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/socaz
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      STRIPE_WEBHOOK_SECRET: whsec_e2e_lokaler_testschluessel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npm run test:integration
      # Dieselben Kartensuiten im Provisionsmodell (TEST_LEDGER_MODEL=commission, Skript scripts/test-commission.mjs): der Produktivpfad der Abbuchung (venue_payable) wird mitgeprueft.
      - name: Integrationstests Provisionsmodell
        run: npm run test:integration:commission

  # Sammelcheck mit dem alten Namen: Das Ruleset "main-schutz" verlangt "Browser-Tests" genau so.
  # Gruen nur, wenn changes, e2e-shard und integration erfolgreich waren ODER (docs_only ist true UND e2e-shard und integration uebersprungen wurden).
  # Rot bei failure, cancelled und bei skipped ohne docs_only. Tabelle: scripts/ci-gate.mjs (aggregate), tests/unit/ci-gate.test.ts.
  browser-tests:
    name: Browser-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, e2e-shard, integration]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ergebnisse pruefen
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: node scripts/ci-gate.mjs aggregate
