name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Name unveraendert: Pflicht-Check im Ruleset "main-schutz".
  check:
    name: Typen, Lint, Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Der Build rendert Seiten vor und braucht dafuer eine migrierte Datenbank.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/socaz
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src tests scripts
      - run: npm test
      - run: node scripts/migrate.mjs
      - run: npm run build

  # Browser-Tests in 4 Teilen. Jeder Teil hat einen eigenen Postgres-Dienst (nichts wird geteilt).
  e2e-shard:
    name: Browser-Tests Teil ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Offizielles Playwright-Image, Version EXAKT wie @playwright/test in package-lock.json
    # (der Schritt "Playwright-Version pruefen" bricht bei Abweichung ab). Digest = Multi-Arch-Index (MCR, abgefragt 2026-11-11 15:14 UTC).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Im Container-Job ist der Dienst unter seinem Namen erreichbar, nicht ueber 127.0.0.1 (der Waechter der Integrationstests erlaubt "postgres" nur mit GITHUB_ACTIONS=true)
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/socaz
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      E2E_BASE_URL: http://127.0.0.1:3100
      STRIPE_WEBHOOK_SECRET: whsec_e2e_lokaler_testschluessel
    steps:
      - uses: actions/checkout@v4
      - name: Playwright-Version pruefen
        run: |
          node -e '
            const fs = require("fs");
            const lock = require("./package-lock.json").packages["node_modules/@playwright/test"].version;
            const m = fs.readFileSync(".github/workflows/ci.yml", "utf8").match(/playwright:v([0-9.]+)-/);
            if (!m || m[1] !== lock) { console.error("Image-Tag " + (m && m[1]) + " != Lockfile " + lock); process.exit(1); }
            console.log("Playwright " + lock + " == Image-Tag");
          '
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
      - name: Entwicklungsserver starten
        env:
          PAYMENTS_FAKE: "1"
        run: |
          npm run dev -- -p 3100 > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/api/health && exit 0
            sleep 2
          done
          cat dev-server.log
          exit 1
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Berichte sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fehler-${{ matrix.shard }}
          path: |
            test-results
            dev-server.log
          retention-days: 7

  integration:
    name: Integrationstests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Ohne Container direkt auf dem Runner: der Dienst ist ueber 127.0.0.1 erreichbar (wie bisher).
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/socaz
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      STRIPE_WEBHOOK_SECRET: whsec_e2e_lokaler_testschluessel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npm run test:integration

  # Sammelcheck mit dem alten Namen: Das Ruleset "main-schutz" verlangt "Browser-Tests" genau so.
  # Rot, sobald ein Teil nicht erfolgreich war (auch abgebrochen oder uebersprungen).
  browser-tests:
    name: Browser-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [e2e-shard, integration]
    steps:
      - name: Ergebnisse pruefen
        env:
          ERGEBNISSE: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Ergebnisse: $ERGEBNISSE"
          for r in $ERGEBNISSE; do
            if [ "$r" != "success" ]; then
              echo "Mindestens ein Teil war nicht erfolgreich ($r)."
              exit 1
            fi
          done
