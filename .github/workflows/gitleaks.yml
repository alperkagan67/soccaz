name: gitleaks

# Sucht Zugangsdaten in der Git-Historie. Keine Fremd-Action: das CLI-Binary kommt aus dem
# Release gitleaks/gitleaks v8.30.1 (Commit 83d9cd684c87d95d656c1458ef04895a7f1cbd8e) und wird
# gegen die SHA-256 aus gitleaks_8.30.1_checksums.txt geprueft. Kein Pflicht-Check im Ruleset.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks laden und Pruefsumme pruefen
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Historie pruefen
        run: ./gitleaks git --redact --no-banner --verbose --config .gitleaks.toml .
