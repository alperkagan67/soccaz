version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Major-Updates nur nach Plan (Backlog 178 bis 181), nicht als automatischer PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    # Playwright vorerst NICHT automatisch (alle Updates): bis Image-Tag und Digest in ci.yml mitgezogen werden, Backlog 182 (Playwright 1.65.1).
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright"
    # Stripe vorerst NICHT automatisch (alle Versionen und Update-Typen): bis Backlog 183 (Stripe-Bump mit apiVersion-Pin) erledigt ist; ohne gesetzte apiVersion aendert ein SDK-Bump die Standard-API-Version.
      - dependency-name: "stripe"
      - dependency-name: "@stripe/stripe-js"
      - dependency-name: "@stripe/react-stripe-js"
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - "*"
