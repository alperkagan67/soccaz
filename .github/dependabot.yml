version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Major-Updates nur nach Plan (Backlog 178 bis 181), nicht als automatischer PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - "*"
