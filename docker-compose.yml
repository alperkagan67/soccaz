# Socaz: App, Datenbank, Reverse Proxy mit automatischem HTTPS und tägliche Sicherung.
# Start:   cp .env.production.example .env   (Werte eintragen)   dann   docker compose up -d --build
# Update:  git pull && docker compose up -d --build
name: socaz

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-socaz}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-socaz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-socaz}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-socaz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-socaz}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${APP_URL:?APP_URL fehlt}
      ENABLE_SCHEDULER: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-socaz}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-socaz}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Optional: Verfügbarkeits-Überwachung. Start mit: docker compose --profile monitoring up -d
  # Erreichbar nur auf dem Server selbst (http://127.0.0.1:3001), von außen per SSH-Tunnel: ssh -L 3001:127.0.0.1:3001 server
  uptime:
    profiles: ["monitoring"]
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-data:/app/data

volumes:
  uptime-data:
  db-data:
  caddy-data:
  caddy-config:
